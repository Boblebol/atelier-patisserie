name: 🐛 Signalement de Bug
description: Signaler un problème d'affichage, de formulaire ou de performance.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Merci de décrire précisément le comportement rencontré pour nous aider à le reproduire.
  - type: textarea
    id: description
    attributes:
      label: Description du problème
      description: Que s'est-il passé ?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navigateur & Appareil
      placeholder: Ex: Safari iOS 18, Chrome Mac, Firefox...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes de reproduction
      placeholder: |
        1. Aller sur '...'
        2. Cliquer sur '...'
        3. Constater l'erreur
    validations:
      required: true
